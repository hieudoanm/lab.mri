[package]
name = "mri-lab"
version = "0.1.0"
description = "MRI Lab - project-scoped computational neuroimaging platform"
authors = ["MRI Lab Contributors"]
license = "MIT"
repository = "https://github.com/hieudoanm/mri-lab"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mri_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
